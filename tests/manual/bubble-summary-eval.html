<!doctype html><html lang="ja"><meta charset="utf-8"><title>バブル要約の実モデル検証</title>
<style>body{font:16px system-ui;max-width:1000px;margin:32px auto;padding:16px;background:#202123;color:#eee}button,select{font:inherit;padding:8px;margin:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere}button:disabled{opacity:.4}</style>
<h1>バブル要約の実モデル検証</h1><p>アプリに保存したOpenRouterキーを内部で使用します。キーやチャットを出力・削除しません。人工ケースだけを送信します。総費用上限 $10。API経路はアプリと共通です。</p>
<select id="phase" aria-label="検証フェーズ"><option value="baseline">Opus 基準・調整用32件 × 3回</option><option value="candidate">Opus 現行・調整用32件 × 3回</option><option value="downstream-baseline">Opus 基準・原文/置換後の応答 × 各3回</option><option value="downstream-candidate">Opus 現行・原文/置換後の応答 × 各3回</option><option value="candidate2">Opus 再調整・32件 × 3回</option><option value="downstream-candidate2">Opus 再調整・原文/置換後の応答 × 各3回</option><option value="candidate3">Opus 最終調整・32件 × 3回</option><option value="downstream-candidate3">Opus 最終調整・原文/置換後の応答 × 各3回</option><option value="candidate4">Opus 確認案・32件 × 3回</option><option value="downstream-candidate4">Opus 確認案・原文/置換後の応答 × 各3回</option><option value="candidate5">Opus 採用関係の調整・32件 × 2回</option><option value="downstream-candidate5">Opus 採用関係の調整・原文/置換後の応答 × 各2回</option><option value="holdout">Opus 未使用4件 × 3回 + 後続応答</option><option value="free">無料2モデル・パラメータ比較 × 各2回</option><option value="free-gemma">無料Gemma・未完了の比較を実行</option><option value="free-qwen">無料Qwen・未完了の比較を実行</option></select>
<button id="run">実行</button><button id="stop" disabled>停止</button><button id="download">記録を保存</button>
<p id="status" role="status">初期化中</p><pre id="progress"></pre><details><summary>出力記録（認証情報を含まない）</summary><pre id="records"></pre></details>
<script type="module" src="./bubble-summary-eval.ts"></script></html>
