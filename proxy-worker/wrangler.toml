name = "weavelet-stream-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "enable_request_signal"]
workers_dev = false
preview_urls = false

[vars]
PROXY_SUSPENDED = "true"

[observability]
enabled = true
head_sampling_rate = 1

# Secrets (set via `wrangler secret put <NAME>`):
# - PROXY_AUTH_TOKEN: Token to authenticate clients to this proxy

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "ProxySession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProxySession"]

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "SessionRegistry"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SessionRegistry"]
